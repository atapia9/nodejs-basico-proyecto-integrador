name: Reporte de error
description: Algo no funciona como se espera
title: "[Error] "
labels: []
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre
      description: Describe el problema y el resultado que esperabas.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Comandos o peticiones (método, URL y cuerpo) en orden.
      placeholder: |
        1. npm start
        2. POST /libros con el cuerpo { ... }
    validations:
      required: true
  - type: textarea
    id: salida
    attributes:
      label: Mensaje de error o respuesta
      description: Copia el texto de la terminal o la respuesta de la API. No incluyas contraseñas, claves ni cadenas de conexión.
      render: text
    validations:
      required: false
  - type: input
    id: entorno
    attributes:
      label: Versión de Node.js y sistema operativo
      description: Resultado de node -v y el sistema que usas.
    validations:
      required: false
